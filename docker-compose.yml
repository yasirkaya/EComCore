services:
  backend:
    build:
      context: .
      dockerfile: Backend/EComCore.API/Dockerfile
    container_name: ecomcore-backend
    ports:
      - "5292:5292"
      - "7265:7265"
    environment:
      - ASPNETCORE_URLS=http://+:5292;http://+:7265
    networks:
      - ecomcore-network
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecomcore-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=yourStrongPassword
    ports:
      - "1433:1433"
    networks:
      - ecomcore-network
    volumes:
      - ecomcore-db-data:/var/opt/mssql

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ecomcore-client
    ports:
      - "3001:3001"
    networks:
      - ecomcore-network
    depends_on:
      backend:
        condition: service_healthy

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: ecomcore-admin
    ports:
      - "3000:3000"
    networks:
      - ecomcore-network
    depends_on:
      backend:
        condition: service_healthy

  aiflow:
    build:
      context: ./AIFlow
      dockerfile: Dockerfile
    container_name: aiflow-service
    ports:
      - "8000:8000"
    networks:
      - ecomcore-network

networks:
  ecomcore-network:
    driver: bridge

volumes:
  ecomcore-db-data:
